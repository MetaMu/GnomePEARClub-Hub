<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gnome Pear Club · My Profile</title><meta name="description" content="Create your local Gnome Pear Club member profile."><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head>
<body><div class="site-shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">🍐</span><span>Gnome Pear Club</span></a><nav aria-label="Profile navigation"><a href="index.html#realmfinder">Realmfinder</a><a href="index.html#members">Members</a></nav></header><main class="section-pad" style="max-width:850px"><p class="eyebrow">Identity rune</p><h1 style="font:500 clamp(3rem,8vw,7rem)/.9 'Playfair Display',serif;letter-spacing:-.06em;margin:.2rem 0 1.5rem">Your place in the grove.</h1><p class="section-note">This starter profile saves on this device while the club’s member records and steward workflow are being connected.</p><form id="profile-form" class="survey-card" style="margin-top:2.5rem"><label class="alias-label" for="profile-name">Gnome alias</label><input class="text-input" id="profile-name" maxlength="40" required placeholder="What should the clan call you?"><label class="alias-label" for="profile-place">Forest, city, or region</label><input class="text-input" id="profile-place" maxlength="60" placeholder="Where are you growing from?"><label class="alias-label" for="profile-contact">Preferred contact</label><input class="text-input" id="profile-contact" maxlength="100" placeholder="Email or social handle"><button class="button button-primary" type="submit">Save my profile <span>→</span></button></form><p id="profile-status" class="section-note" style="margin-top:1.5rem"></p></main><footer class="footer section-pad"><div class="footer-brand"><span class="brand-mark">🍐</span><span>Gnome Pear Club</span></div><a href="index.html#top">Back to the old pear tree ↑</a></footer></div><script>
const form=document.querySelector('#profile-form');const status=document.querySelector('#profile-status');const saved=JSON.parse(localStorage.getItem('gpc-profile')||'null');if(saved){document.querySelector('#profile-name').value=saved.name||'';document.querySelector('#profile-place').value=saved.place||'';document.querySelector('#profile-contact').value=saved.contact||'';status.textContent='Your local profile is saved on this device.'}form.addEventListener('submit',event=>{event.preventDefault();const profile={name:document.querySelector('#profile-name').value.trim(),place:document.querySelector('#profile-place').value.trim(),contact:document.querySelector('#profile-contact').value.trim()};localStorage.setItem('gpc-profile',JSON.stringify(profile));status.textContent='Profile saved. Your $1 identity credit is now marked pending.'});
</script></body></html>
